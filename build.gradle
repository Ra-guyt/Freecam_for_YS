plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.17.491" apply false
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

tasks.named("wrapper") {
    distributionType = "all"
    gradleVersion = "8.11"
}

afterEvaluate {
    tasks.jar.enabled = false
    tasks.sourcesJar.enabled = false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = "${project.mod_version}+mc${project.minecraft_version}"
    group = rootProject.maven_group

    base {
        archivesName = rootProject.name + project.path.replaceAll(":", "-")
    }

    repositories {
        mavenCentral()
        maven { url "https://maven.parchmentmc.org/" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/" }
    }

    def javaVersion = 21
    def javaLanguageVersion = JavaLanguageVersion.of(javaVersion)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = javaVersion
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = javaLanguageVersion
        })
    }

    java {
        toolchain {
            languageVersion = javaLanguageVersion
        }
        withSourcesJar()
    }

    jar {
        from rootProject.file("LICENSE")
        from rootProject.file("NOTICE.md")
    }

    // Make release archives byte-for-byte reproducible across clean checkouts.
    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        accessWidenerPath = project(":common").file("src/main/resources/freecam.accesswidener")

        runs {
            client {
                configName "Run Freecam for YS"
            }
            remove server
        }

        silentMojangMappingsLicense()
    }

    dependencies {
        def parchmentAppendix = rootProject.parchment_version.split("-")[0]
        def parchmentVersion = rootProject.parchment_version.split("-")[1]

        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchmentAppendix}:${parchmentVersion}@zip")
        }
    }

    publishing {
        repositories {
            mavenLocal()
        }
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }
}
