plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = "${mod_version}+mc${minecraft_version}"
group = maven_group
base { archivesName = 'freecam_for_ys-fabric' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources', 'metadata/src/fabric']
    }
    test { java.srcDirs = ['common/src/test/java'] }
}
processResources {
    def props = [mod_id: 'freecam_for_ys', version: project.version, mod_name: mod_name,
                 json_authors: authors.split(',').collect { '"' + it + '"' }.join(', '),
                 description: project.description, licence: licence, homepage_url: homepage_url,
                 source_code_url: source_code_url, issue_tracker_url: issue_tracker_url,
                 fabric_loader_req: fabric_loader_req, fabric_mc_req: fabric_mc_req]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
test { useJUnitPlatform() }
jar { from('LICENSE'); from('NOTICE.md') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'freecam_for_ys_test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
