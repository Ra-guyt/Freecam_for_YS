plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude module: "fabric-api"
    }

    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_version}"

    common project(path: ":common", configuration: "namedElements")
    shadowCommon project(path: ":common", configuration: "transformProductionFabric")

    implementation project(path: ":metadata", configuration: "fabric")
    shadowCommon project(path: ":metadata", configuration: "fabric")
}

shadowJar {
    group = "shadow"
    from sourceSets.main.output
    exclude "architectury.common.json"
    exclude "architectury_inject_*/**"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    group = "loom"
    inputFile = tasks.shadowJar.archiveFile
    dependsOn tasks.shadowJar
    injectAccessWidener = true
    destinationDirectory = rootProject.layout.buildDirectory.dir("libs")

    // Architectury adds an unreferenced marker class under a random package
    // name. Excluding it removes the last source of nondeterminism.
    exclude "architectury_inject_*/**"
}

tasks.build.dependsOn tasks.remapJar

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
